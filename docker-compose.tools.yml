name: "go-admin-wallet-wallet-service"
services:
  go-tools:
    container_name: ${GROUP_NAME:-phillong97254}-wallet-service-go-tools-${ENV:-dev}
    # Image công cụ dev (migrate, buf, protoc-gen-go...) từ repo github.com/phillong97254/go-tools.
    # Chưa có image thì Docker tự build từ git tag, không cần registry.
    image: ghcr.io/phillong97254/go-tools:v1.0.0
    build:
      context: https://github.com/phillong97254/go-tools.git#v1.0.0
    volumes:
      - .:/tool
    working_dir: /tool
    environment:
      PROTO_GEN_CONFIG_FILE: "buf.gen.yaml"
      DB_URL: postgres://wallet:${DB_PASSWORD:?đặt trong .env (xem .env.example)}@postgres:5432/wallet_db?sslmode=disable
    networks:
      - wallet-service-network

networks:
  wallet-service-network:
    driver: bridge
