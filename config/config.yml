grpc_server:
  name: wallet-service
  addr: ":50051"

api:
  version: v1.0.0
  env: debug

oauth:
  jwks_url: http://localhost:9000/.well-known/jwks.json
  issuer: http://localhost:9000
  audience: admin-api

db:
  url: "" # KHÔNG ghi ở đây, đặt qua env DB_URL (file .env, không commit)
  max_open_connections: 20
  max_idle_connections: 10
  connection_max_lifetime: 5 # phút
  connection_max_idle_time: 5 # phút
  auto_migrate: true
  log_sql: false
